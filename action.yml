name: 'GitHub Action for Vultr - vultr-cli'
description: 'Use vultr-cli to manage your Vultr resources.'
author: 'techknowlogick <techknowlogick@gitea.io>'
inputs:
  version:
    description: 'Version of vultr-cli to install, e.g. "3.0.0". Defaults to the latest release.'
    default: 'latest'
  token:
    description: 'Vultr API key. Exported as VULTR_API_KEY for later steps in the job.'
    required: true
  github-token:
    description: 'GitHub token used to look up vultr-cli releases, to avoid unauthenticated API rate limits.'
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
outputs:
  version:
    description: 'The version of vultr-cli that was installed.'
runs:
  using: 'node24'
  main: 'dist/index.js'
